<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEOPro OG Image Template</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
            font-family: 'Montserrat', sans-serif;
        }
        .container {
            width: 1200px;
            height: 627px;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a1a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        .background-pattern {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(circle at 20% 30%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                              radial-gradient(circle at 80% 70%, rgba(59, 130, 246, 0.1) 0%, transparent 50%);
            z-index: 1;
        }
        .content {
            z-index: 2;
            text-align: center;
        }
        h1 {
            font-size: 120px;
            font-weight: 800;
            color: #ffffff;
            margin: 0;
            letter-spacing: -2px;
            text-transform: uppercase;
        }
        .pro {
            color: #3b82f6;
        }
        p {
            font-size: 32px;
            color: #a0a0a0;
            margin-top: 20px;
            font-weight: 500;
            letter-spacing: 1px;
        }
        .badge {
            margin-top: 40px;
            padding: 10px 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            color: #737373;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="background-pattern"></div>
        <div class="content">
            <h1>SEO<span class="pro">Pro</span></h1>
            <p>SEO Professional Portfolio</p>
            <div class="badge">Showcasing Expertise & Performance</div>
        </div>
    </div>
</body>
</html>
